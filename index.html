<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RehabTrack</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 25px;
      color: #1e293b;
    }
    main {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }
    h1 { color: #087f70; }
    input, button {
      padding: 10px;
      margin: 5px 0;
    }
    button {
      background: #087f70;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    li { margin: 12px 0; }
  
  
body {
  font-family: Arial, sans-serif;
  background: #edf5f3;
  color: #243746;
  padding: 40px 16px;
}

main {
  max-width: 650px;
  margin: 30px auto;
  padding: 35px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
  color: #087f70;
  font-size: 36px;
}

h2 {
  color: #243746;
  margin-top: 28px;
}

input {
  padding: 12px;
  border: 1px solid #ccd8d5;
  border-radius: 8px;
  max-width: 100%;
}

button {
  background: #087f70;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #066458;
}

li {
  padding: 12px;
  margin: 10px 0;
  background: #f3f8f7;
  border-radius: 8px;
}

.delete-btn {
  background: #dc3545;
  margin-left: 15px;
}

.delete-btn:hover {
  background: #b52a37;
}

progress {
  width: 100%;
  height: 18px;
  accent-color: #087f70;
}

</style>
  </head>
<body>
  <main>
    <h1>RehabTrack</h1>
    <p>Rehabilitation Exercise Tracker</p>

    <h2>Add an Exercise</h2>
    <input id="exercise" placeholder="Exercise name">
    <input id="reps" type="number" min="1"
           placeholder="Repetitions">
    <button onclick="addExercise()">Add Exercise</button>

    <h2>Exercise List</h2>
    <ul id="exerciseList"></ul>

    <h3 id="progress">Completed: 0 of 0</h3>
    <progress id="progressBar" value="0" max="100"></progress>
  </main>

  <script>
    let exercises = JSON.parse(
      localStorage.getItem("exercises") || "[]"
    );

    function save() {
      localStorage.setItem(
        "exercises", JSON.stringify(exercises)
      );
    }

    function addExercise() {
      const name = document.getElementById("exercise").value.trim();
      const reps = Number(document.getElementById("reps").value);

      if (!name || !Number.isInteger(reps) || reps < 1) {
        alert("Enter an exercise and valid repetitions.");
        return;
      }

      exercises.push({ name, reps, done: false });
      save();
      render();

      document.getElementById("exercise").value = "";
      document.getElementById("reps").value = "";
    }

    function toggleExercise(index) {
      exercises[index].done = !exercises[index].done;
      save();
      render();
    }
function deleteExercise(index) {
  if (!confirm("Delete this exercise?")) return;

  exercises.splice(index, 1);
  save();
  render();
}
    function render() {
      const list = document.getElementById("exerciseList");
      list.replaceChildren();

      exercises.forEach((exercise, index) => {
        const item = document.createElement("li");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = exercise.done;
        checkbox.addEventListener("change", () => {
          toggleExercise(index);
        });

        item.append(
          checkbox,
          document.createTextNode(
            `${exercise.name} - ${exercise.reps} reps`
          )
        );
        const deleteButton = document.createElement("button");
deleteButton.textContent = "Delete";
deleteButton.className = "delete-btn";
deleteButton.addEventListener("click", () => {
  deleteExercise(index);
});

item.appendChild(deleteButton);
        list.appendChild(item);
      });

      const completed = exercises.filter(e => e.done).length;
      document.getElementById("progress").textContent =
        `Completed: ${completed} of ${exercises.length}`;
      const percentage = exercises.length
  ? (completed / exercises.length) * 100
  : 0;

document.getElementById("progressBar").value = percentage;
    }

    render();
  </script>
</body>
</html>
